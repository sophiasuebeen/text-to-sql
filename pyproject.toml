[project]
name = "text-to-sql"
version = "0.1.0"
description = "QLoRA fine-tuning of a small Qwen model for SQLite text-to-SQL, with an execution-accuracy evaluator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "sqlglot>=30.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
